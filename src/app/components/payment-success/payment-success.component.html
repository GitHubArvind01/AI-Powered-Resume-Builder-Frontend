<div class="status-container">

  <!-- ✅ Success state -->
  <div class="card fade-in" *ngIf="!verificationFailed">
    <div class="icon-circle success">
      <div class="checkmark"></div>
    </div>
    <h1>Payment Successful!</h1>
    <p class="description">Your subscription has been activated successfully.</p>

    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
    <p class="redirect">{{ statusMessage }}</p>
  </div>

  <!-- ❌ Verification failed state -->
  <div class="card fade-in" *ngIf="verificationFailed">
    <div class="icon-circle error">
      <div class="cross"></div>
    </div>
    <h1>Verification Failed</h1>
    <p class="description">{{ statusMessage }}</p>
    <p class="redirect">Redirecting you back to payment page…</p>
  </div>

</div>
