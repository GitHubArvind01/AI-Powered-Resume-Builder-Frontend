<div class="editor-container">
  <header class="editor-header no-print">
    <div class="header-left">
      <button class="back-btn" (click)="goBack()">Back</button>
      <div class="title-section">
        <h1>{{ resume?.title || 'New Resume' }}</h1>
        <span *ngIf="isSaving" class="saving-indicator">Saving...</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="action-btn ats-btn" (click)="showAtsDrawer = true" [disabled]="isLoading">
        ATS Check
      </button>
      <button class="action-btn export-btn" [disabled]="isExporting" (click)="exportToPdf()">
        <span *ngIf="!isExporting">Export PDF</span>
        <span *ngIf="isExporting" class="btn-spinner"></span>
      </button>
      <button class="action-btn save-btn" (click)="saveResume()" [disabled]="isSaving">
        <span *ngIf="!isSaving">Save</span>
        <span *ngIf="isSaving" class="btn-spinner"></span>
      </button>
    </div>
  </header>

  <div class="editor-content full-page" *ngIf="resume">
    <div class="resume-page shadow-lg" id="resume-editor-page">
      <div class="resume-content-editable" [innerHTML]="safeHtmlContent"></div>
    </div>
  </div>

  <div *ngIf="isLoading" class="loading-overlay">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>
</div>

<app-ats-checker
  [isOpen]="showAtsDrawer"
  [resumeId]="resume?.id || ''"
  (close)="showAtsDrawer = false">
</app-ats-checker>
