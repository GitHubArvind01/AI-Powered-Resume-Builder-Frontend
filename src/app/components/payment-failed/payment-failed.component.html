<div class="status-container">
  <div class="card fade-in">
    <div class="icon-circle failed">
      <div class="cross"></div>
    </div>
    <h1>Payment Failed</h1>
    <p class="description">We couldn't process your transaction. Please check your card details and try again.</p>

    <button routerLink="/payment" class="btn-retry">Try Again</button>
    <p class="redirect" style="margin-top: 15px;">Or contact support if the issue persists.</p>
  </div>
</div>
