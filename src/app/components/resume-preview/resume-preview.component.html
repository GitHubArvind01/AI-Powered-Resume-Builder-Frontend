<div class="preview-wrapper" *ngIf="!isLoading">
  <header class="action-header">
    <div class="header-left">
      <button class="back-btn" (click)="goBack()">Back</button>
      <span class="template-tag">{{ templateName }}</span>
    </div>

    <div class="header-actions">
      <button class="action-btn format-btn" (click)="applyTextCommand('bold')">Bold</button>
      <button class="action-btn format-btn" (click)="applyTextCommand('italic')">Italic</button>
      <button class="action-btn format-btn" (click)="applyTextCommand('underline')">Underline</button>
      <button class="action-btn format-btn" (click)="makeTextLarge()">A+</button>
      <button class="action-btn format-btn" (click)="makeTextSmall()">A-</button>
      <button class="action-btn ai-btn" (click)="improveSummary()" [disabled]="isImprovingSummary">
        {{ isImprovingSummary ? 'Improving...' : 'Improve Summary' }}
      </button>
      <button class="action-btn ats-btn" (click)="toggleAtsCheck()">ATS Check</button>
      <button class="action-btn export-btn" (click)="exportPDF()" [disabled]="isExporting">
        <span *ngIf="!isExporting">Export PDF</span>
        <span *ngIf="isExporting" class="spinner-small"></span>
      </button>
      <button class="action-btn save-btn" (click)="saveResume()" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : 'Save' }}
      </button>
    </div>
  </header>

  <main class="preview-main">
    <ng-container [ngSwitch]="templateId">
      <app-minimalist-resume-template
        *ngSwitchCase="'minimalist'"
        [resume]="resume"
        [editable]="true"
        (resumeChange)="onResumeChange($event)">
      </app-minimalist-resume-template>

      <app-modern-resume-template
        *ngSwitchCase="'modern'"
        [resume]="resume"
        [editable]="true"
        (resumeChange)="onResumeChange($event)">
      </app-modern-resume-template>

      <app-professional-resume-template
        *ngSwitchCase="'professional'"
        [resume]="resume"
        [editable]="true"
        (resumeChange)="onResumeChange($event)">
      </app-professional-resume-template>

      <app-creative-resume-template
        *ngSwitchCase="'creative'"
        [resume]="resume"
        [editable]="true"
        (resumeChange)="onResumeChange($event)">
      </app-creative-resume-template>

      <app-executive-resume-template
        *ngSwitchCase="'executive'"
        [resume]="resume"
        [editable]="true"
        (resumeChange)="onResumeChange($event)">
      </app-executive-resume-template>

      <app-modern-resume-template
        *ngSwitchDefault
        [resume]="resume"
        [editable]="true"
        (resumeChange)="onResumeChange($event)">
      </app-modern-resume-template>
    </ng-container>
  </main>
</div>

<app-ats-checker
  [isOpen]="showAtsDrawer"
  [resumeId]="currentResumeId"
  (close)="showAtsDrawer = false">
</app-ats-checker>
