<div class="preview-wrapper" *ngIf="!isLoading">
  <header class="action-header">
    <div class="header-left">
      <button class="back-btn" (click)="goBack()">← Back</button>
      <span class="template-tag">Preview Mode: {{ templateId }}</span>
    </div>

    <div class="header-actions">
      <button class="action-btn ats-btn" (click)="toggleAtsCheck()">ATS Check</button>
      <button class="action-btn export-btn" (click)="exportPDF()" [disabled]="isExporting">
        <span *ngIf="!isExporting">Export PDF</span>
        <span *ngIf="isExporting" class="spinner-small"></span>
      </button>
      <button class="action-btn save-btn" (click)="saveResume()" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : 'Save' }}
      </button>
    </div>
  </header>

  <main class="preview-main">
    <div id="resume-a4-page" class="resume-page" [ngClass]="'template-' + templateId">
      <header class="page-header">
        <h1 contenteditable="true" (blur)="onContentChange('personalInfo', 'fullName', $event)">
          {{ resume.personalInfo.fullName || 'Full Name' }}
        </h1>
        <p class="contact-info">
          <span contenteditable="true" (blur)="onContentChange('personalInfo', 'email', $event)">{{ resume.personalInfo.email || 'Email' }}</span> |
          <span contenteditable="true" (blur)="onContentChange('personalInfo', 'phone', $event)">{{ resume.personalInfo.phone || 'Phone' }}</span>
        </p>
      </header>

      <section class="page-section">
        <h2 class="section-title">Summary</h2>
        <p class="editable-area" contenteditable="true" (blur)="onContentChange('summary', null, $event)">
          {{ resume.summary || 'Click to write your summary...' }}
        </p>
      </section>

      <!-- Section logic continues for Experience/Education following the same pattern -->
    </div>
  </main>
</div>

<app-ats-checker
  [isOpen]="showAtsDrawer"
  [resumeId]="currentResumeId"
  (close)="showAtsDrawer = false">
</app-ats-checker>
